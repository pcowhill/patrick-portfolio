<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2a3440" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="420" fill="#1b2129"/>
  <rect width="640" height="420" fill="url(#grid2)" opacity="0.6"/>

  <!-- Route graph -->
  <g stroke-linecap="round" fill="none">
    <!-- unclaimed routes -->
    <g stroke="#3f4b5a" stroke-width="6" stroke-dasharray="14 8">
      <path d="M70 120 L160 80"/>
      <path d="M160 80 L280 100"/>
      <path d="M280 100 L380 60"/>
      <path d="M70 120 L130 210"/>
      <path d="M130 210 L240 190"/>
      <path d="M240 190 L280 100"/>
      <path d="M240 190 L330 260"/>
      <path d="M330 260 L410 200"/>
      <path d="M410 200 L380 60"/>
      <path d="M130 210 L90 300"/>
      <path d="M90 300 L210 320"/>
      <path d="M210 320 L330 260"/>
    </g>
    <!-- agent A (green) -->
    <g stroke="#3fae78" stroke-width="6" stroke-dasharray="14 8">
      <path d="M70 120 L160 80"/>
      <path d="M160 80 L280 100"/>
      <path d="M280 100 L380 60"/>
      <path d="M410 200 L380 60"/>
    </g>
    <!-- agent B (light slate) -->
    <g stroke="#aab4bf" stroke-width="6" stroke-dasharray="14 8">
      <path d="M130 210 L240 190"/>
      <path d="M240 190 L330 260"/>
      <path d="M210 320 L330 260"/>
    </g>
  </g>
  <!-- cities -->
  <g fill="#e6e9ed" stroke="#1b2129" stroke-width="3">
    <circle cx="70" cy="120" r="7"/><circle cx="160" cy="80" r="7"/><circle cx="280" cy="100" r="7"/>
    <circle cx="380" cy="60" r="7"/><circle cx="130" cy="210" r="7"/><circle cx="240" cy="190" r="7"/>
    <circle cx="330" cy="260" r="7"/><circle cx="410" cy="200" r="7"/><circle cx="90" cy="300" r="7"/>
    <circle cx="210" cy="320" r="7"/>
  </g>

  <!-- Results panel -->
  <g>
    <rect x="452" y="76" width="152" height="270" rx="10" fill="#242d38" stroke="#3f4b5a"/>
    <text x="528" y="104" text-anchor="middle" fill="#e6e9ed" font-size="13" font-weight="600">N simulated games</text>
    <text x="528" y="122" text-anchor="middle" fill="#7f8b98" font-size="11">win rate by strategy</text>
    <g font-size="11" fill="#a3adb8">
      <text x="468" y="160">strategy A</text>
      <text x="468" y="204">strategy B</text>
      <text x="468" y="248">strategy C</text>
      <text x="468" y="292">strategy D</text>
    </g>
    <g fill="#3f4b5a">
      <rect x="468" y="166" width="120" height="10" rx="3"/>
      <rect x="468" y="210" width="120" height="10" rx="3"/>
      <rect x="468" y="254" width="120" height="10" rx="3"/>
      <rect x="468" y="298" width="120" height="10" rx="3"/>
    </g>
    <g fill="#3fae78">
      <rect x="468" y="166" width="54" height="10" rx="3"/>
      <rect x="468" y="210" width="88" height="10" rx="3"/>
      <rect x="468" y="254" width="70" height="10" rx="3"/>
      <rect x="468" y="298" width="40" height="10" rx="3"/>
    </g>
    <text x="528" y="332" text-anchor="middle" fill="#7f8b98" font-size="10">illustrative, not measured</text>
  </g>

  <text x="320" y="380" text-anchor="middle" fill="#7f8b98" font-size="11">rules → board graph · card economy · scoring → agents → repeated simulation</text>
</svg>
