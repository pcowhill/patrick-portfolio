<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7f8b98"/>
    </marker>
    <pattern id="grid3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#2a3440" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="420" fill="#1b2129"/>
  <rect width="640" height="420" fill="url(#grid3)" opacity="0.6"/>

  <g font-size="12" text-anchor="middle">
    <!-- row 1 -->
    <g>
      <rect x="40" y="70" width="150" height="56" rx="10" fill="#242d38" stroke="#3f4b5a"/>
      <text x="115" y="94" fill="#e6e9ed" font-weight="600">requirements</text>
      <text x="115" y="112" fill="#7f8b98" font-size="11">→ issues</text>
    </g>
    <path d="M190 98H236" stroke="#7f8b98" stroke-width="1.5" marker-end="url(#arr3)"/>
    <g>
      <rect x="240" y="70" width="150" height="56" rx="10" fill="#242d38" stroke="#3f4b5a"/>
      <text x="315" y="94" fill="#e6e9ed" font-weight="600">implementation</text>
      <text x="315" y="112" fill="#7f8b98" font-size="11">branch · commits</text>
    </g>
    <path d="M390 98H436" stroke="#7f8b98" stroke-width="1.5" marker-end="url(#arr3)"/>
    <g>
      <rect x="440" y="70" width="150" height="56" rx="10" fill="#242d38" stroke="#3f4b5a"/>
      <text x="515" y="94" fill="#e6e9ed" font-weight="600">pull request</text>
      <text x="515" y="112" fill="#7f8b98" font-size="11">diff · discussion</text>
    </g>

    <!-- down -->
    <path d="M515 126V166" stroke="#7f8b98" stroke-width="1.5" marker-end="url(#arr3)"/>

    <!-- row 2 -->
    <g>
      <rect x="440" y="170" width="150" height="56" rx="10" fill="#242d38" stroke="#3fae78"/>
      <text x="515" y="194" fill="#e6e9ed" font-weight="600">independent review</text>
      <text x="515" y="212" fill="#3fae78" font-size="11">approve / request changes</text>
    </g>
    <path d="M440 198H394" stroke="#7f8b98" stroke-width="1.5" marker-end="url(#arr3)"/>
    <g>
      <rect x="240" y="170" width="150" height="56" rx="10" fill="#242d38" stroke="#3fae78"/>
      <text x="315" y="194" fill="#e6e9ed" font-weight="600">automated tests</text>
      <text x="315" y="212" fill="#3fae78" font-size="11">CI · required checks</text>
    </g>
    <path d="M240 198H194" stroke="#7f8b98" stroke-width="1.5" marker-end="url(#arr3)"/>
    <g>
      <rect x="40" y="170" width="150" height="56" rx="10" fill="#242d38" stroke="#3f4b5a"/>
      <text x="115" y="194" fill="#e6e9ed" font-weight="600">merge</text>
      <text x="115" y="212" fill="#7f8b98" font-size="11">main</text>
    </g>

    <!-- down -->
    <path d="M115 226V266" stroke="#7f8b98" stroke-width="1.5" marker-end="url(#arr3)"/>

    <!-- row 3 -->
    <g>
      <rect x="40" y="270" width="150" height="56" rx="10" fill="#242d38" stroke="#3f4b5a"/>
      <text x="115" y="294" fill="#e6e9ed" font-weight="600">CI/CD deploy</text>
      <text x="115" y="312" fill="#7f8b98" font-size="11">build · release</text>
    </g>
    <path d="M190 298H236" stroke="#7f8b98" stroke-width="1.5" marker-end="url(#arr3)"/>
    <g>
      <rect x="240" y="270" width="150" height="56" rx="10" fill="#242d38" stroke="#3f4b5a"/>
      <text x="315" y="294" fill="#e6e9ed" font-weight="600">feedback</text>
      <text x="315" y="312" fill="#7f8b98" font-size="11">use · observe · report</text>
    </g>

    <!-- feedback loop back to issues -->
    <path d="M390 298 H612 V40 H115 V66" fill="none" stroke="#3fae78" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arr3)"/>
    <text x="612" y="30" fill="#3fae78" font-size="11" text-anchor="end">iterate</text>
  </g>

  <text x="320" y="380" text-anchor="middle" fill="#7f8b98" font-size="11">GitHub as the operating environment · AI-assisted engineering with the same gates as any team</text>
</svg>
